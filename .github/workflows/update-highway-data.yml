name: Update highway data

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download freeway XML data
        run: |
          mkdir -p data
          curl --fail --silent --show-error --retry 3 "https://tisvcloud.freeway.gov.tw/history/motc20/CMSLive.xml" -o data/CMSLive.xml
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/CMSLive.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update highway XML cache"
          git push

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>HEYCAR 航班看板</title><link rel="stylesheet" href="/assets/flight-board.css?v=20261123-1"></head><body>
<main class="board-layout"><section class="flights-column"><section class="tracked-panel"><header class="section-heading"><h1>追蹤航班</h1><span id="trackingCount"></span></header><div id="trackedFlights" class="tracked-flights"></div></section><section class="arrivals-panel"><header class="section-heading"><h2>即將抵達</h2><span id="refreshCountdown">05:00 後更新</span></header><div class="arrivals-labels"><span>預計抵達</span><span>航空公司／航班</span><span>出發地</span><span>航廈</span></div><div id="upcomingFlights"></div></section></section><aside class="news-column"><section id="liveNews" class="live-news"></section><section class="board-notes"><span id="announcementCount" hidden></span><div id="companyAnnouncement"></div></section></aside></main>
<footer class="board-marquee"><b id="tickerLabel">公告</b><div><span id="marqueeText"></span></div><time id="clock"></time></footer><div class="board-connection"><span id="boardStatus" role="status">正在連線</span><span id="updatedAt"></span></div>
<div class="board-start" id="startOverlay"><div><p id="startMessage">準備接收航班抵達提醒</p><button id="enableAudio">開始看板與廣播</button></div></div>
<script type="module" src="/assets/flight-board.js?v=20261123-1"></script></body></html>

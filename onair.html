<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>亞菲得即時資訊看板</title>
  <link rel="stylesheet" href="./onair.css?v=20260530-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="board-shell">
    <header class="board-topbar">
      <div class="brand">
        <img src="https://www.heycar.com.tw/images/heycar_logo.png" alt="heycar logo">
        <div>
          <strong>亞菲得即時資訊看板</strong>
          <span>Live Dispatch Board</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="enableVoice" type="button">啟用語音通知</button>
        <time id="clock">--:--</time>
      </div>
    </header>

    <main class="board-grid">
      <section class="panel news-panel">
        <div class="panel-head">
          <h1>即時直播</h1>
          <select id="sourceSelect" aria-label="切換直播來源"></select>
        </div>
        <iframe id="liveFrame" title="即時直播" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </section>

      <section class="panel arrival-panel">
        <div class="panel-head">
          <h2>目前降落資訊</h2>
          <button id="refreshBtn" type="button">刷新</button>
        </div>
        <div id="arrivalList" class="arrival-list">
          <div class="empty">載入抵達航班中...</div>
        </div>
      </section>

      <section class="panel tracked-panel">
        <div class="panel-head">
          <h2>目前追蹤航班</h2>
          <span id="trackCount">0 架</span>
        </div>
        <div id="trackedList" class="tracked-list">
          <div class="empty">尚未追蹤航班</div>
        </div>
      </section>
    </main>
  </div>

  <script src="./config.example.js?v=20260530-2"></script>
  <script src="./onair.js?v=20260530-1"></script>
</body>
</html>
